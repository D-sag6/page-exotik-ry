<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Exotik RY - Menú & Gestión</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <header class="app-header">
        <h1 class="logo-title">La Exotik RY</h1>
        <nav class="role-selector">
            <button class="role-btn active" onclick="switchRole('client')">Menú / Cliente</button>
            <button class="role-btn" onclick="switchRole('kitchen')">Cocina</button>
            <button class="role-btn" onclick="switchRole('manager')">Administración</button>
        </nav>
    </header>

    <main class="container">
        <!-- VISTA CLIENTE -->
        <section id="clientView" class="view-section active">
            <h2 class="section-title">Nuestro Menú</h2>
            <div id="menuContainer" class="menu-grid"></div>

            <div class="cart-drawer">
                <h3>Tu Pedido</h3>
                <div id="cartItems"></div>
                <div class="cart-summary">
                    <p>Total: <strong id="cartTotal">$0</strong></p>
                    <button class="btn-primary" onclick="submitOrder()">Enviar Pedido</button>
                </div>
            </div>
        </section>

        <!-- VISTA COCINA -->
        <section id="kitchenView" class="view-section" style="display: none;">
            <h2 class="section-title">Comandas en Cocina</h2>
            <div id="kitchenOrders" class="orders-grid"></div>
        </section>

        <!-- VISTA ADMINISTRACIÓN -->
        <section id="managerView" class="view-section" style="display: none;">
            <h2 class="section-title">Panel de Administración</h2>
            
            <div class="manager-card-box">
                <h3 class="subsection-title" style="color: var(--primary-pink, #ff4081); margin-bottom: 15px;">Gestión de Menú (Modificar Nombres y Precios)</h3>
                
                <div style="max-height: 500px; overflow-y: auto;">
                    <table class="recent-orders-table">
                        <thead>
                            <tr>
                                <th>Categoría</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Descripción</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="managerProductsTable"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
